<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Recetas and Menú: plan the meals of the week, then Llenar cesta sends their products to Compra</title>
  <rect width="800" height="440" rx="16" fill="#ecebe8"/>

  <!-- Menú -->
  <rect x="32" y="32" width="340" height="376" rx="12" fill="#f9f8f5"/>
  <text x="52" y="68" font-size="20" font-weight="700" fill="#1c1917">Menú</text>
  <text x="52" y="88" font-size="12" fill="#78716c">Semana del 2 de noviembre</text>
  <g font-size="12">
    <rect x="52" y="104" width="4" height="70" rx="2" fill="#13734b"/>
    <text x="64" y="118" font-weight="700" fill="#1c1917">Lunes</text>
    <rect x="64" y="128" width="140" height="44" rx="6" fill="#fff" stroke="#e7e5e4"/>
    <text x="74" y="144" font-size="10" fill="#78716c">Comida</text>
    <text x="74" y="162" font-weight="600" fill="#1c1917">Lentejas</text>
    <rect x="212" y="128" width="140" height="44" rx="6" fill="#fff" stroke="#e7e5e4"/>
    <text x="222" y="144" font-size="10" fill="#78716c">Cena</text>
    <text x="222" y="162" font-weight="600" fill="#1c1917">Tortilla</text>

    <rect x="52" y="186" width="4" height="70" rx="2" fill="#d6d3d1"/>
    <text x="64" y="200" font-weight="700" fill="#1c1917">Martes</text>
    <rect x="64" y="210" width="140" height="44" rx="6" fill="#fff" stroke="#e7e5e4"/>
    <text x="74" y="226" font-size="10" fill="#78716c">Comida</text>
    <text x="74" y="244" font-weight="600" fill="#1c1917">Ensalada</text>
    <rect x="212" y="210" width="140" height="44" rx="6" fill="#fff" stroke="#e7e5e4" stroke-dasharray="4 3"/>
    <text x="222" y="226" font-size="10" fill="#78716c">Cena</text>
    <text x="222" y="244" fill="#a8a29e">+ Añadir</text>

    <text x="64" y="282" font-weight="700" fill="#a8a29e">Miércoles … Domingo</text>
  </g>
  <rect x="52" y="340" width="300" height="44" rx="22" fill="#13734b"/>
  <text x="202" y="367" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Llenar cesta</text>

  <!-- Arrow -->
  <path d="M388 220h40" stroke="#78716c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M418 210l12 10-12 10" fill="none" stroke="#78716c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Recipe and Compra -->
  <rect x="446" y="32" width="322" height="170" rx="12" fill="#fff"/>
  <text x="466" y="64" font-size="11" font-weight="700" letter-spacing=".4" fill="#78716c">RECETA</text>
  <text x="466" y="88" font-size="18" font-weight="700" fill="#1c1917">Lentejas</text>
  <g font-size="13" fill="#1c1917">
    <text x="466" y="116">• Lentejas</text>
    <text x="466" y="138">• Zanahorias</text>
    <text x="466" y="160">• Chorizo</text>
    <text x="606" y="116">• Cebolla</text>
    <text x="606" y="138">• Pimentón</text>
  </g>
  <text x="466" y="188" font-size="11" fill="#78716c">A product is a name, not an item</text>

  <rect x="446" y="218" width="322" height="190" rx="12" fill="#f9f8f5"/>
  <text x="466" y="250" font-size="18" font-weight="700" fill="#1c1917">Compra</text>
  <text x="466" y="274" font-size="11" font-weight="700" letter-spacing=".4" fill="#78716c">LENTEJAS</text>
  <g font-size="13" font-weight="500" fill="#1c1917">
    <rect x="460" y="284" width="294" height="30" rx="6" fill="#fff"/>
    <circle cx="478" cy="299" r="8" fill="none" stroke="#d6d3d1" stroke-width="2"/>
    <text x="494" y="304">Zanahorias</text>
    <rect x="460" y="318" width="294" height="30" rx="6" fill="#fff"/>
    <circle cx="478" cy="333" r="8" fill="none" stroke="#d6d3d1" stroke-width="2"/>
    <text x="494" y="338">Chorizo</text>
    <text x="466" y="374" font-size="11" font-weight="700" letter-spacing=".4" fill="#78716c">TORTILLA</text>
    <rect x="460" y="382" width="294" height="20" rx="6" fill="#fff"/>
  </g>
</svg>
