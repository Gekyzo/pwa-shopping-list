<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Mobile first: the same list on a phone, a tablet and a desktop, in sync through the account</title>
  <defs>
    <symbol id="row" viewBox="0 0 200 28"><rect width="200" height="24" rx="5" fill="#fff"/><circle cx="14" cy="12" r="6.5" fill="none" stroke="#d6d3d1" stroke-width="1.8"/><rect x="28" y="9" width="90" height="6" rx="3" fill="#a8a29e"/></symbol>
    <symbol id="done" viewBox="0 0 200 28"><rect width="200" height="24" rx="5" fill="#f5f5f4"/><circle cx="14" cy="12" r="7" fill="#13734b"/><path d="M10.5 12.3l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="9" width="70" height="6" rx="3" fill="#d6d3d1"/></symbol>
    <symbol id="panel" viewBox="0 0 200 120"><rect width="200" height="120" rx="8" fill="#fff"/><rect x="12" y="14" width="80" height="8" rx="4" fill="#1c1917"/><rect x="12" y="34" width="150" height="6" rx="3" fill="#d6d3d1"/><rect x="12" y="50" width="120" height="6" rx="3" fill="#d6d3d1"/><rect x="12" y="66" width="140" height="6" rx="3" fill="#d6d3d1"/></symbol>
  </defs>
  <rect width="800" height="440" rx="16" fill="#ecebe8"/>

  <!-- Desktop -->
  <rect x="300" y="40" width="460" height="290" rx="12" fill="#1c1917"/>
  <rect x="310" y="50" width="440" height="260" rx="4" fill="#f9f8f5"/>
  <rect x="310" y="50" width="96" height="260" fill="#fff"/>
  <rect x="322" y="66" width="60" height="8" rx="4" fill="#13734b"/>
  <rect x="322" y="88" width="50" height="6" rx="3" fill="#a8a29e"/>
  <rect x="322" y="106" width="40" height="6" rx="3" fill="#a8a29e"/>
  <rect x="322" y="124" width="48" height="6" rx="3" fill="#a8a29e"/>
  <rect x="420" y="66" width="90" height="10" rx="5" fill="#1c1917"/>
  <use href="#row" x="420" y="90" width="200" height="28"/>
  <use href="#row" x="420" y="122" width="200" height="28"/>
  <use href="#done" x="420" y="154" width="200" height="28"/>
  <use href="#row" x="420" y="186" width="200" height="28"/>
  <use href="#panel" x="632" y="90" width="106" height="64"/>
  <use href="#panel" x="632" y="162" width="106" height="64"/>
  <path d="M500 330h60l10 30h-80z" fill="#44403c"/>
  <rect x="460" y="358" width="140" height="8" rx="4" fill="#44403c"/>

  <!-- Tablet -->
  <rect x="150" y="130" width="200" height="270" rx="18" fill="#292524"/>
  <rect x="160" y="142" width="180" height="246" rx="8" fill="#f9f8f5"/>
  <rect x="172" y="158" width="70" height="9" rx="4.5" fill="#1c1917"/>
  <use href="#row" x="172" y="178" width="156" height="22"/>
  <use href="#row" x="172" y="204" width="156" height="22"/>
  <use href="#done" x="172" y="230" width="156" height="22"/>
  <use href="#panel" x="172" y="264" width="156" height="94"/>

  <!-- Phone -->
  <rect x="40" y="200" width="120" height="216" rx="18" fill="#1c1917"/>
  <rect x="48" y="210" width="104" height="196" rx="12" fill="#f9f8f5"/>
  <rect x="58" y="224" width="50" height="8" rx="4" fill="#1c1917"/>
  <use href="#row" x="56" y="242" width="88" height="13"/>
  <use href="#row" x="56" y="260" width="88" height="13"/>
  <use href="#done" x="56" y="278" width="88" height="13"/>
  <use href="#row" x="56" y="296" width="88" height="13"/>
  <rect x="48" y="384" width="104" height="22" fill="#fff"/>
  <rect x="58" y="392" width="14" height="5" rx="2.5" fill="#13734b"/>
  <rect x="82" y="392" width="14" height="5" rx="2.5" fill="#d6d3d1"/>
  <rect x="106" y="392" width="14" height="5" rx="2.5" fill="#d6d3d1"/>
  <rect x="130" y="392" width="14" height="5" rx="2.5" fill="#d6d3d1"/>

  <!-- Labels -->
  <g font-size="13" font-weight="700" fill="#1c1917">
    <text x="40" y="52">Installed on Android</text>
    <text x="40" y="70" font-weight="400" fill="#78716c">or in any browser</text>
    <text x="40" y="94" font-weight="400" fill="#78716c">Works offline. Syncs when</text>
    <text x="40" y="110" font-weight="400" fill="#78716c">you sign in with Google.</text>
  </g>
  <g font-size="11" fill="#78716c" text-anchor="middle">
    <text x="100" y="432">phone</text>
    <text x="250" y="420">tablet</text>
    <text x="530" y="390">desktop</text>
  </g>
</svg>
