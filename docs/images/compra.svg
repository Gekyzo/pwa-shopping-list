<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Compra: the list of the trip, with ticked, recurrent and open items, and the end of the trip</title>
  <defs>
    <symbol id="tick" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#13734b"/><path d="M10 16.5l4 4 8-8.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="idle" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#d6d3d1" stroke-width="2"/></symbol>
    <symbol id="repeat" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M18 2v5h-5" fill="none" stroke="#b34a24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
  <rect width="800" height="440" rx="16" fill="#ecebe8"/>

  <!-- Phone -->
  <rect x="60" y="24" width="250" height="392" rx="28" fill="#1c1917"/>
  <rect x="70" y="34" width="230" height="372" rx="20" fill="#f9f8f5"/>
  <text x="86" y="72" font-size="20" font-weight="700" fill="#1c1917">Compra</text>
  <text x="86" y="90" font-size="11" fill="#78716c">3 de 6 comprados</text>
  <rect x="86" y="98" width="198" height="4" rx="2" fill="#e7e5e4"/>
  <rect x="86" y="98" width="99" height="4" rx="2" fill="#13734b"/>

  <text x="86" y="124" font-size="10" font-weight="700" letter-spacing=".4" fill="#78716c">LÁCTEOS</text>
  <g font-size="13" font-weight="500">
    <rect x="80" y="132" width="210" height="36" rx="6" fill="#fff"/>
    <use href="#idle" x="88" y="138" width="24" height="24"/>
    <text x="120" y="155" fill="#1c1917">Leche</text>
    <use href="#repeat" x="268" y="142" width="14" height="14"/>

    <rect x="80" y="172" width="210" height="36" rx="6" fill="#fff"/>
    <use href="#idle" x="88" y="178" width="24" height="24"/>
    <text x="120" y="195" fill="#1c1917">Yogur natural</text>

    <text x="86" y="232" font-size="10" font-weight="700" letter-spacing=".4" fill="#78716c">PANADERÍA</text>
    <rect x="80" y="240" width="210" height="36" rx="6" fill="#fff"/>
    <use href="#idle" x="88" y="246" width="24" height="24"/>
    <text x="120" y="263" fill="#1c1917">Pan</text>
    <use href="#repeat" x="268" y="250" width="14" height="14"/>

    <rect x="80" y="280" width="210" height="36" rx="6" fill="#f5f5f4"/>
    <use href="#tick" x="88" y="286" width="24" height="24"/>
    <text x="120" y="303" fill="#a8a29e">Huevos</text>
    <line x1="120" y1="299" x2="167" y2="299" stroke="#a8a29e" stroke-width="1.5"/>

    <rect x="80" y="320" width="210" height="36" rx="6" fill="#f5f5f4"/>
    <use href="#tick" x="88" y="326" width="24" height="24"/>
    <text x="120" y="343" fill="#a8a29e">Tomates</text>
    <line x1="120" y1="339" x2="176" y2="339" stroke="#a8a29e" stroke-width="1.5"/>
  </g>
  <rect x="70" y="370" width="230" height="36" fill="#fff"/>
  <g font-size="9" fill="#78716c" text-anchor="middle">
    <text x="99" y="392" font-weight="700" fill="#13734b">Compra</text>
    <text x="156" y="392">Recetas</text>
    <text x="213" y="392">Menú</text>
    <text x="270" y="392">Ajustes</text>
  </g>

  <!-- Arrow -->
  <path d="M340 220h70" stroke="#78716c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400 210l12 10-12 10" fill="none" stroke="#78716c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375" y="200" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">Terminar</text>
  <text x="375" y="250" font-size="13" font-weight="700" fill="#1c1917" text-anchor="middle">compra</text>

  <!-- Next trip -->
  <g font-size="14">
    <text x="440" y="96" font-size="18" font-weight="700" fill="#1c1917">The next trip</text>
    <rect x="440" y="116" width="300" height="76" rx="10" fill="#fff"/>
    <use href="#repeat" x="456" y="130" width="18" height="18"/>
    <text x="484" y="144" font-weight="700" fill="#1c1917">Recurrent items come back</text>
    <text x="484" y="168" fill="#78716c">Leche, Pan</text>

    <rect x="440" y="204" width="300" height="76" rx="10" fill="#fff"/>
    <circle cx="465" cy="239" r="8" fill="none" stroke="#d6d3d1" stroke-width="2"/>
    <text x="484" y="232" font-weight="700" fill="#1c1917">Items not bought</text>
    <text x="484" y="256" fill="#78716c">Aplazar or Descartar, as you choose</text>

    <rect x="440" y="292" width="300" height="76" rx="10" fill="#e3f1ea"/>
    <path d="M457 330l5 5 10-11" fill="none" stroke="#13734b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="484" y="320" font-weight="700" fill="#13734b">One-time items bought</text>
    <text x="484" y="344" fill="#13734b">leave the list</text>
  </g>
</svg>
