<!doctype html>
<!-- The Play feature graphic, 1024×500. Render: agent-browser set viewport 1024 500, open this file, screenshot docs/play/feature-graphic.png (headless Chrome --screenshot paints only 412 px of it). -->
<html lang="es">
<meta charset="utf-8">
<style>
  @font-face { font-family: "Hanken Grotesk"; src: url("../../fonts/hanken-grotesk-latin.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; overflow: hidden; background: #fff8f5; }
  main {
    width: 1024px; height: 500px; display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
    font-family: "Hanken Grotesk", system-ui, sans-serif; color: #1f1b17;
    background: radial-gradient(ellipse 560px 420px at 238px 250px, #ffe2c4, #fff8f5 72%);
  }
  img { width: 300px; height: 300px; flex: none; }
  h1 { margin: 0 0 18px; font-size: 104px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  p { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.3; color: #3f4942; max-width: 560px; }
</style>
<body>
<main>
  <img src="../../icons/icon-512.png" alt="">
  <div>
    <h1>Bodega</h1>
    <p>La lista de la compra que se prepara sola para la próxima vez</p>
  </div>
</main>
</body>
</html>
