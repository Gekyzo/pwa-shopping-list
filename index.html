<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1f7a4d">
    <title>Compra</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="head">
      <div id="ring" class="ring"><span id="ring-text"></span></div>
      <div class="head-text">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" type="button" hidden>Deshacer</button>
    </div>

    <main>
      <ul id="items" class="items"></ul>

      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <button id="bring" class="primary" type="button" hidden></button>
      </div>

      <section id="finish" class="banner" hidden>
        <strong>¿Has terminado?</strong>
        <p id="finish-text"></p>
        <button id="finish-button" class="primary" type="button">Terminar compra</button>
      </section>

      <section id="settings" class="settings" hidden>
        <h2>Compra</h2>
        <div class="group">
          <button id="finish-setting" type="button"><span>Terminar compra</span><small id="finish-setting-text"></small></button>
        </div>
        <h2>Copia de seguridad</h2>
        <div class="group">
          <button id="export" type="button"><span>Exportar copia</span></button>
          <button id="import" type="button"><span>Importar copia</span></button>
        </div>
      </section>
    </main>

    <button id="fab" class="fab" type="button" aria-label="Añadir artículo">+</button>

    <nav class="bnav" aria-label="Secciones">
      <button type="button" data-view="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>
        <span>Actual</span>
      </button>
      <button type="button" data-view="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Próxima</span>
        <em id="next-count" class="badge-count"></em>
      </button>
      <button type="button" data-view="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h13a1 1 0 0 1 1 1v17H6a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1z"/><path d="M4 17h15M9 8h6"/></svg>
        <span>Recetas</span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>

    <div id="sheet" class="sheet-layer" hidden>
      <div id="veil" class="veil"></div>
      <form id="add" class="sheet" autocomplete="off" aria-label="Añadir artículo">
        <div class="grab"></div>
        <div class="add-row">
          <input id="add-name" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="80"
            placeholder="Añadir artículo a la lista" aria-label="Añadir artículo a la lista">
          <button id="add-submit" class="primary" type="submit">Añadir</button>
        </div>
        <div id="seg" class="seg">
          <button type="button" data-target="active">Para hoy</button>
          <button type="button" data-target="next">Para la próxima</button>
        </div>
        <ul id="suggestions" class="suggestions" aria-label="Artículos que ya existen"></ul>
      </form>
    </div>

    <datalist id="item-names"></datalist>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
