<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f7a4d">
    <title>Compra</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="top">
      <h1>Compra</h1>
      <button id="start" class="primary" type="button">Nueva compra</button>
      <details id="menu" class="menu">
        <summary aria-label="Menú">⋮</summary>
        <div class="menu-items">
          <button id="export" type="button">Exportar copia</button>
          <button id="import" type="button">Importar copia</button>
        </div>
      </details>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </header>

    <nav class="tabs" role="tablist">
      <button id="tab-active" role="tab" type="button" data-tab="active">Actual <span class="count"></span></button>
      <button id="tab-next" role="tab" type="button" data-tab="next">Próxima <span class="count"></span></button>
    </nav>

    <main>
      <ul id="items" class="items"></ul>
      <p id="empty" class="empty" hidden></p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" type="button" hidden>Deshacer</button>
    </div>

    <ul id="suggestions" class="suggestions" aria-label="Artículos que ya existen" hidden></ul>

    <form id="add" class="add" autocomplete="off">
      <input id="add-name" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="80"
        placeholder="Añadir artículo a la lista" aria-label="Añadir artículo a la lista">
      <button class="primary" type="submit">Añadir</button>
    </form>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
