<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0e">
    <meta name="theme-color" content="#f4f3f1">
    <title>Bodega - Lista de la compra</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
      <button id="search-button" class="button icon" type="button" data-i18n-attr="aria-label:search.label" aria-controls="search" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#search"/></svg>
      </button>
      <button id="arrange-button" class="button icon" type="button" data-i18n-attr="aria-label:arrange.label" aria-haspopup="dialog" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#filter"/></svg>
      </button>
      <button id="trip-button" class="button icon" type="button" data-i18n-attr="aria-label:trip.menu" aria-haspopup="dialog" aria-controls="trip" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#more"/></svg>
      </button>
      <div id="progress" class="progress" role="progressbar" aria-labelledby="subtitle" aria-valuemin="0" aria-valuemax="100" hidden></div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-undo" class="button strong" type="button" data-i18n="toast.undo" hidden></button>
    </div>

    <main>
      <p id="sync-offline" class="sync-note" role="status" hidden><svg class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span data-i18n="sync.offline"></span></p>

      <section id="sync-banner" class="banner" hidden>
        <strong data-i18n="sync.banner"></strong>
        <p class="banner-text" data-i18n="sync.bannerText"></p>
        <button id="sync-login" class="button tonal wide" type="button" data-i18n="account.login.title"></button>
      </section>

      <section id="share-banner" class="banner" hidden>
        <strong id="share-banner-text"></strong>
        <button id="share-banner-open" class="button tonal wide" type="button" data-i18n="share.bannerOpen"></button>
      </section>

      <div id="shop-chips" class="cluster scroll shop-lists" role="group" data-i18n-attr="aria-label:shops.lists" hidden></div>

      <div id="shop-done" class="empty-state" hidden>
        <h2 id="shop-done-text" class="empty-state-title"></h2>
        <button id="shop-done-next" class="button tonal" type="button"></button>
        <button id="shop-done-all" class="button tonal" type="button" data-i18n="shops.seeAll"></button>
      </div>

      <div id="search" class="search" hidden>
        <input id="query" class="input raised" type="search" maxlength="80" autocomplete="off" enterkeyhint="search">
      </div>

      <ul id="items" class="item-list"></ul>

      <div id="empty" class="empty-state low" hidden>
        <h2 id="empty-title" class="empty-state-title" hidden></h2>
        <p id="empty-text"></p>
        <button id="empty-action" class="button primary wide" type="button" hidden></button>
        <button id="empty-secondary" class="button tonal wide" type="button" hidden></button>
      </div>


      <div id="menu-actions" class="action-bar" hidden>
        <div class="split">
          <button id="menu-fill" class="button primary hand-side" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#cart-add"/></svg><span class="action-label" data-i18n="menu.fill"></span></button>
          <button id="menu-clear" class="button outline danger" type="button" data-i18n="menu.clear"></button>
        </div>
      </div>

      <section id="finish" class="banner done" hidden>
        <strong data-i18n="finish.question"></strong>
        <p id="finish-text" class="banner-text"></p>
        <button id="finish-button" class="button tonal wide" type="button" data-i18n="finish.button"></button>
      </section>

      <section id="settings" class="settings" hidden>
        <div id="account-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.account"></h2>
          <div class="list-group">
            <div id="account-row" class="settings-row account-row"><span id="account-email" class="settings-row-label"></span><span id="account-sync" class="settings-row-value"></span></div>
            <button id="share-open" class="settings-row" type="button" aria-haspopup="dialog" aria-controls="share" hidden><span class="settings-row-label" data-i18n="share.row"></span><span id="share-count" class="settings-row-value"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="logout" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="account.logout"></span></button>
            <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="sync.banner"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.backup"></h2>
        <div class="list-group">
          <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span></button>
        </div>
        <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.language"></span>
            <span id="language-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.hand"></span>
            <span id="hand-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.theme"></span>
            <span id="theme-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.density"></span>
            <span id="density-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="density" class="select" data-i18n-attr="aria-label:settings.density"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.tripEnd"></h2>
        <p class="hint settings-hint" data-i18n="settings.tripEndHint"></p>
        <div class="list-group">
          <div id="trip-end" class="segmented" role="group" data-i18n-attr="aria-label:settings.tripEnd">
            <button class="segment" type="button" data-trip-end="save" data-i18n="trip.discard"></button>
            <button class="segment" type="button" data-trip-end="keep" data-i18n="trip.postpone"></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.aisles"></h2>
        <div class="list-group">
          <button id="aisles-open" class="settings-row" type="button" aria-haspopup="dialog" aria-controls="aisles"><span class="settings-row-label" data-i18n="aisles.title"></span><span id="aisles-count" class="settings-row-value"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <div id="install-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="delete-sample" class="settings-row danger" type="button" hidden><span class="settings-row-label" data-i18n="settings.deleteSample"></span></button>
        </div>
        <div id="update-banner" class="banner" hidden>
          <strong id="update-title"></strong>
          <p id="update-text" class="banner-text"></p>
          <button id="update" class="button primary wide" type="button" data-i18n="settings.update"></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
        </footer>
      </section>
    </main>

    <div id="dock" class="dock" hidden>
      <button id="dock-prev" class="button icon" type="button" data-i18n-attr="aria-label:dock.previous">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg>
      </button>
      <button id="dock-shop" class="chip" type="button" aria-haspopup="dialog" aria-controls="shop-pick"></button>
      <button id="dock-next" class="button icon" type="button" data-i18n-attr="aria-label:dock.next">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-right"/></svg>
      </button>
      <button id="dock-search" class="button icon" type="button" data-i18n-attr="aria-label:search.label" aria-controls="dock-field">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#search"/></svg>
      </button>
      <label id="dock-field" class="dock-field" hidden>
        <svg class="icon small" aria-hidden="true"><use href="icons.svg#search"/></svg>
        <input id="dock-query" class="dock-input" type="search" maxlength="80" autocomplete="off" enterkeyhint="search">
        <button id="dock-clear" class="dock-clear" type="button" data-i18n-attr="aria-label:search.clear"><svg class="icon small" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
      </label>
      <button id="dock-cancel" class="button accent" type="button" data-i18n="search.cancel" hidden></button>
      <button id="dock-add" class="button primary icon dock-add" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#plus"/></svg></button>
    </div>

    <button id="fab" class="fab" type="button">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="active">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#cart"/></svg>
        <span data-i18n="list.active"></span>
      </button>
      <button class="nav-item" type="button" data-view="recipes">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#book"/></svg>
        <span data-i18n="nav.recipes"></span>
      </button>
      <button class="nav-item" type="button" data-view="menu">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#menu"/></svg>
        <span data-i18n="nav.menu"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="sheet" class="sheet-layer" hidden>
      <div id="veil" class="sheet-veil"></div>
      <form id="add" class="sheet" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="add-title" class="sheet-title main"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <ul id="suggestions" class="list-group plain" data-i18n-attr="aria-label:add.existing"></ul>
          <p id="add-help" class="input-help danger" role="alert" hidden></p>
          <div class="input-row pinned">
            <input id="add-name" class="input strong" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="80" aria-describedby="add-help">
            <button id="add-submit" class="button primary" type="submit" disabled></button>
          </div>
        </div>
      </form>
    </div>

    <div id="arrange" class="sheet-layer" hidden>
      <div id="arrange-veil" class="sheet-veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:arrange.label">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 class="sheet-title main" data-i18n="arrange.label"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <div id="arrange-group">
            <h2 class="sheet-title" data-i18n="arrange.groupBy"></h2>
            <div class="segmented">
              <button class="segment" type="button" data-group="recipe" data-i18n="nav.recipes"></button>
              <button class="segment" type="button" data-group="shop" data-i18n="arrange.shops"></button>
              <button class="segment" type="button" data-group="aisle" data-i18n="arrange.aisles"></button>
              <button class="segment" type="button" data-group="none" data-i18n="arrange.none"></button>
            </div>
          </div>
          <div id="arrange-sort">
            <h2 class="sheet-title" data-i18n="arrange.sortBy"></h2>
            <div class="segmented">
              <button class="segment" type="button" data-sort="name" data-i18n="arrange.name"></button>
              <button class="segment" type="button" data-sort="custom" data-i18n="arrange.custom"></button>
            </div>
          </div>
          <div id="arrange-lists">
            <h2 class="sheet-title" data-i18n="shops.lists"></h2>
            <div class="segmented">
              <button class="segment" type="button" data-lists="show" data-i18n="arrange.show"></button>
              <button class="segment" type="button" data-lists="hide" data-i18n="arrange.hide"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="shop-pick" class="sheet-layer" hidden>
      <div id="shop-pick-veil" class="sheet-veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:shops.lists">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 class="sheet-title main" data-i18n="shops.lists"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body"></div>
      </div>
    </div>

    <div id="trip" class="sheet-layer" hidden>
      <div id="trip-veil" class="sheet-veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:trip.menu">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 class="sheet-title main" data-i18n="trip.question"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <ul id="trip-outcomes" class="list-group plain"></ul>
          <p id="trip-open" class="hint trip-open" hidden><span data-i18n="trip.hint"></span> <button id="trip-settings" class="button accent" type="button" data-i18n="nav.settings"></button></p>
          <button id="finish-menu" class="button primary wide" type="button" data-i18n="finish.button"></button>
          <button id="trip-continue" class="button tonal wide" type="button" data-i18n="trip.continue"></button>
        </div>
      </div>
    </div>

    <div id="meal" class="sheet-layer" hidden>
      <div id="meal-veil" class="sheet-veil"></div>
      <div id="meal-sheet" class="sheet" role="dialog">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="meal-title" class="sheet-title main"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <input id="meal-query" class="input" type="search" maxlength="80" autocomplete="off" enterkeyhint="done" data-i18n-attr="placeholder:menu.search,aria-label:menu.search">
          <p id="meal-empty" class="empty-state inline" hidden></p>
          <div id="meal-chips" class="cluster"></div>
          <button id="meal-dish" class="button tonal wide" type="button" hidden></button>
          <div id="meal-actions" class="split meal-actions" hidden>
            <button id="meal-recipe" class="button primary hand-side" type="button" data-i18n="menu.toRecipe" hidden></button>
            <button id="meal-remove" class="button outline danger" type="button" data-i18n="menu.remove" hidden></button>
          </div>
        </div>
      </div>
    </div>

    <div id="edit" class="sheet-layer" hidden>
      <div id="edit-veil" class="sheet-veil"></div>
      <form id="edit-form" class="sheet" role="dialog" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="edit-title" class="sheet-title main"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <label class="field"><input id="edit-name" class="input field-input" type="text" enterkeyhint="done" maxlength="80" data-i18n-attr="aria-label:edit.name,placeholder:edit.name"><span class="field-label" data-i18n="edit.name"></span></label>
          <label class="field"><input id="edit-quantity" class="input field-input" type="text" enterkeyhint="done" maxlength="20" data-i18n-attr="aria-label:edit.quantity,placeholder:edit.quantity"><span class="field-label" data-i18n="edit.quantity"></span></label>
          <label class="switch"><span data-i18n="edit.repeat"></span><input id="edit-repeat" class="switch-input" type="checkbox" role="switch"></label>
          <h2 class="sheet-title part" data-i18n="edit.shops"></h2>
          <div id="edit-chips" class="cluster"></div>
          <p id="edit-empty" class="empty-state inline" data-i18n="shops.empty" hidden></p>
          <div class="input-row">
            <input id="edit-shop" class="input strong" type="text" list="edit-shops" enterkeyhint="done" autocapitalize="words" maxlength="40" data-i18n-attr="placeholder:shops.placeholder,aria-label:shops.placeholder">
            <button id="edit-shop-submit" class="button primary" type="submit" data-i18n="shops.add" disabled></button>
          </div>
          <datalist id="edit-shops"></datalist>
          <h2 class="sheet-title part" data-i18n="edit.aisle"></h2>
          <div id="edit-aisles" class="cluster"></div>
          <p id="edit-aisles-empty" class="empty-state inline" data-i18n="edit.noAisles" hidden></p>
        </div>
        <footer class="sheet-foot"><button id="edit-delete" class="button outline danger" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="sheet.delete"></span></button><span class="sheet-saved"><svg class="icon small" aria-hidden="true"><use href="icons.svg#check"/></svg><span data-i18n="sheet.saved"></span></span></footer>
      </form>
    </div>

    <div id="aisles" class="sheet-layer" hidden>
      <div id="aisles-veil" class="sheet-veil"></div>
      <form id="aisles-form" class="sheet" role="dialog" autocomplete="off" data-i18n-attr="aria-label:aisles.title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 class="sheet-title main" data-i18n="aisles.title"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <p id="aisles-empty" class="empty-state inline" data-i18n="aisles.empty" hidden></p>
          <button id="aisles-usual" class="button tonal wide" type="button" data-i18n="aisles.usual" hidden></button>
          <ul id="aisles-list" class="products flush"></ul>
          <div class="input-row">
            <input id="aisles-new" class="input strong" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="40" data-i18n-attr="placeholder:aisles.placeholder,aria-label:aisles.placeholder">
            <button id="aisles-submit" class="button primary" type="submit" data-i18n="shops.add" disabled></button>
          </div>
        </div>
      </form>
    </div>

    <div id="share" class="sheet-layer" hidden>
      <div id="share-veil" class="sheet-veil"></div>
      <form id="share-form" class="sheet" role="dialog" autocomplete="off" novalidate data-i18n-attr="aria-label:share.title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 class="sheet-title main" data-i18n="share.title"></h2><button class="button tonal" type="button" data-i18n="edit.done"></button></header>
        <div class="sheet-body">
          <div id="share-owner" class="share-case">
            <p class="input-help" data-i18n="share.text"></p>
            <ul id="share-people" class="products flush"></ul>
            <div class="input-row">
              <input id="share-email" class="input strong" type="email" inputmode="email" autocapitalize="off" enterkeyhint="send" maxlength="254" data-i18n-attr="placeholder:share.email,aria-label:share.email">
              <button id="share-submit" class="button primary" type="submit" data-i18n="share.invite" disabled></button>
            </div>
            <p id="share-error" class="input-help danger" role="alert" hidden></p>
          </div>
          <div id="share-invited" class="share-case" hidden>
            <p id="share-invited-text" class="share-text"></p>
            <p id="share-warning" class="input-help"></p>
            <button id="share-accept" class="button primary wide" type="button" data-i18n="share.accept"></button>
            <button id="share-decline" class="button tonal wide" type="button" data-i18n="share.decline"></button>
          </div>
          <div id="share-member" class="share-case" hidden>
            <p id="share-member-text" class="share-text"></p>
            <button id="share-leave" class="button tonal wide" type="button" data-i18n="share.leave"></button>
          </div>

        <p class="account-switch"><span data-i18n="account.login.noAccount"></span><button id="to-request" class="button accent" type="button" data-i18n="account.request.title"></button></p>
