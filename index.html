<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1f7a4d">
    <title>Grocely - Lista de la compra</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="head">
      <div id="ring" class="ring"><span id="ring-text"></span></div>
      <div class="head-text">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <button id="search-button" class="tool" type="button" data-i18n-attr="aria-label:search.label" aria-controls="search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      </button>
      <button id="arrange-button" class="tool" type="button" data-i18n-attr="aria-label:arrange.label" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <button id="trip-button" class="tool" type="button" data-i18n-attr="aria-label:trip.menu" aria-haspopup="dialog" aria-controls="trip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" type="button" data-i18n="toast.undo" hidden></button>
    </div>

    <main>
      <div id="shop-chips" class="chips shop-chips" role="group" data-i18n-attr="aria-label:shops.lists" hidden></div>

      <div id="shop-done" class="empty" hidden>
        <p id="shop-done-text"></p>
        <button id="shop-done-next" class="primary" type="button"></button>
      </div>

      <div id="search" class="search" hidden>
        <input id="query" type="search" maxlength="80" autocomplete="off" enterkeyhint="search">
      </div>

      <ul id="items" class="items"></ul>

      <div id="empty" class="empty" hidden>
        <p id="empty-text"></p>
        <button id="bring" class="primary" type="button" hidden></button>
      </div>

      <div id="menu-actions" class="menu-actions" hidden>
        <button id="menu-fill" class="primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6M9 18.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M18 18.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M13 8.5v4M11 10.5h4"/></svg><span data-i18n="menu.fill"></span></button>
        <button id="menu-clear" type="button" data-i18n="menu.clear"></button>
      </div>

      <section id="finish" class="banner" hidden>
        <strong data-i18n="finish.question"></strong>
        <p id="finish-text"></p>
        <button id="finish-button" class="primary" type="button" data-i18n="finish.button"></button>
      </section>

      <section id="settings" class="settings" hidden>
        <h2 data-i18n="settings.backup"></h2>
        <div class="group">
          <button id="export" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M12 15V3M7 8l5-5 5 5"/></svg><span data-i18n="settings.export"></span></button>
          <button id="import" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M12 15V3M7 10l5 5 5-5"/></svg><span data-i18n="settings.import"></span></button>
        </div>
        <h2 data-i18n="settings.language"></h2>
        <div class="group">
          <select id="language" data-i18n-attr="aria-label:settings.language"></select>
        </div>
        <h2 data-i18n="settings.hand"></h2>
        <div class="group">
          <select id="hand" data-i18n-attr="aria-label:settings.hand"></select>
        </div>
        <h2 data-i18n="settings.theme"></h2>
        <div class="group">
          <select id="theme" data-i18n-attr="aria-label:settings.theme"></select>
        </div>
        <h2 data-i18n="settings.modules"></h2>
        <div class="group">
          <label class="switch"><span data-i18n="list.next"></span><input type="checkbox" role="switch" data-module="next"></label>
          <label class="switch"><span data-i18n="settings.moduleRecipes"></span><input type="checkbox" role="switch" data-module="recipes"></label>
        </div>
        <h2 data-i18n="settings.help"></h2>
        <div class="group">
          <button id="show-onboarding" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg><span data-i18n="settings.onboarding"></span></button>
        </div>
        <footer class="about">
          <p><span id="version"></span><span id="version-status" role="status" data-status="checking"><svg data-for="checking" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5"/></svg><svg data-for="current" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5 5.5-5.5"/></svg><svg data-for="outdated" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M8 12.5l4 4 4-4"/></svg><svg data-for="unknown" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.6A6 6 0 0 1 17.6 11 4 4 0 0 1 19.3 18M16 18H7a4.5 4.5 0 0 1-1.3-8.8M3 3l18 18"/></svg><span id="version-status-text"></span></span></p>
          <button id="update" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button">+</button>

    <nav class="bnav" data-i18n-attr="aria-label:nav.label">
      <button type="button" data-view="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/></svg>
        <span data-i18n="list.active"></span>
      </button>
      <button type="button" data-view="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span data-i18n="list.next"></span>
        <em id="next-count" class="badge-count"></em>
      </button>
      <button type="button" data-view="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h13a1 1 0 0 1 1 1v17H6a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1z"/><path d="M4 17h15M9 8h6"/></svg>
        <span data-i18n="nav.recipes"></span>
      </button>
      <button type="button" data-view="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M4 3v5a3 3 0 0 0 6 0V3M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg>
        <span data-i18n="nav.menu"></span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="sheet" class="sheet-layer" hidden>
      <div id="veil" class="veil"></div>
      <form id="add" class="sheet" autocomplete="off">
        <div class="grab"></div>
        <div class="add-row">
          <input id="add-name" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="80">
          <button id="add-submit" class="primary" type="submit"></button>
        </div>
        <div id="seg" class="seg">
          <button type="button" data-target="active" data-i18n="add.today"></button>
          <button type="button" data-target="next" data-i18n="add.later"></button>
        </div>
        <ul id="suggestions" class="suggestions" data-i18n-attr="aria-label:add.existing"></ul>
      </form>
    </div>

    <div id="arrange" class="sheet-layer" hidden>
      <div id="arrange-veil" class="veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:arrange.label">
        <div class="grab"></div>
        <div id="arrange-group">
          <h2 data-i18n="arrange.groupBy"></h2>
          <div class="seg">
            <button type="button" data-group="recipe" data-i18n="nav.recipes"></button>
            <button type="button" data-group="shop" data-i18n="arrange.shops"></button>
            <button type="button" data-group="none" data-i18n="arrange.none"></button>
          </div>
        </div>
        <div id="arrange-sort">
          <h2 data-i18n="arrange.sortBy"></h2>
          <div class="seg">
            <button type="button" data-sort="name" data-i18n="arrange.name"></button>
            <button type="button" data-sort="custom" data-i18n="arrange.custom"></button>
          </div>
        </div>
        <div id="arrange-lists">
          <h2 data-i18n="shops.lists"></h2>
          <div class="seg">
            <button type="button" data-lists="show" data-i18n="arrange.show"></button>
            <button type="button" data-lists="hide" data-i18n="arrange.hide"></button>
          </div>
        </div>
      </div>
    </div>

    <div id="trip" class="sheet-layer" hidden>
      <div id="trip-veil" class="veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:trip.menu">
        <div class="grab"></div>
        <h2 data-i18n="trip.menu"></h2>
        <button id="finish-menu" class="entry" type="button"><span data-i18n="finish.button"></span><small id="finish-menu-text"></small></button>
      </div>
    </div>

    <div id="meal" class="sheet-layer" hidden>
      <div id="meal-veil" class="veil"></div>
      <div id="meal-sheet" class="sheet" role="dialog">
        <div class="grab"></div>
        <h2 id="meal-title"></h2>
        <input id="meal-query" type="search" maxlength="80" autocomplete="off" enterkeyhint="search" data-i18n-attr="placeholder:recipes.search,aria-label:recipes.search">
        <p id="meal-empty" class="meal-empty" hidden></p>
        <div id="meal-chips" class="chips"></div>
        <button id="meal-remove" class="danger" type="button" data-i18n="menu.remove" hidden></button>
      </div>
    </div>

    <div id="edit" class="sheet-layer" hidden>
      <div id="edit-veil" class="veil"></div>
      <form id="edit-form" class="sheet" role="dialog" autocomplete="off">
        <div class="grab"></div>
        <h2 id="edit-title"></h2>
        <input id="edit-name" class="edit-name" type="text" enterkeyhint="done" maxlength="80" data-i18n-attr="aria-label:edit.name,placeholder:edit.name">
        <div id="edit-chips" class="chips"></div>
        <p id="edit-empty" class="hint" data-i18n="shops.empty" hidden></p>
        <div class="add-row">
          <input id="edit-shop" type="text" list="edit-shops" enterkeyhint="done" autocapitalize="words" maxlength="40" data-i18n-attr="placeholder:shops.placeholder,aria-label:shops.placeholder">
          <button class="primary" type="submit" data-i18n="shops.add"></button>
        </div>
        <datalist id="edit-shops"></datalist>
      </form>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="lists" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="card accent" x="20" y="20" width="90" height="120" rx="10"/>
            <rect class="accent" x="32" y="40" width="12" height="12" rx="3"/>
            <path class="accent" d="M35 46l2.5 2.5 4-5"/>
            <rect class="accent" x="32" y="70" width="12" height="12" rx="3"/>
            <rect class="accent" x="32" y="100" width="12" height="12" rx="3"/>
            <path d="M52 46h44M52 76h36M52 106h40"/>
            <rect class="card" x="130" y="20" width="90" height="120" rx="10"/>
            <path d="M144 46h62M144 76h50M144 106h56"/>
          </svg>
          <svg data-page="trip" viewBox="0 0 240 160" aria-hidden="true">
            <path class="accent" d="M200 62c-20-34-140-34-160 0M40 62l-2-11M40 62l11-3"/>
            <rect class="card" x="30" y="74" width="180" height="40" rx="10"/>
            <rect class="accent" x="42" y="88" width="12" height="12" rx="3"/>
            <path class="accent" d="M45 94l2.5 2.5 4-5"/>
            <path d="M64 94h80"/>
            <path class="accent" d="M196 94a8 8 0 1 1-2.3-5.7M194 84v5h-5"/>
          </svg>
          <svg data-page="row" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="card" x="20" y="50" width="132" height="40" rx="10"/>
            <rect class="accent" x="32" y="64" width="12" height="12" rx="3"/>
            <path d="M54 70h70"/>
            <rect class="soft" x="158" y="52" width="28" height="36" rx="6"/>
            <rect class="soft" x="190" y="52" width="28" height="36" rx="6"/>
            <path class="accent" d="M40 122h56M88 114l8 8-8 8"/>
            <path class="accent" d="M200 122h-56M152 114l-8 8 8 8"/>
          </svg>
          <svg data-page="sections" viewBox="0 0 240 160" aria-hidden="true">
            <path class="accent" d="M66 48h88M74 40l-8 8 8 8M146 40l8 8-8 8"/>
            <circle class="solid" cx="194" cy="82" r="13"/>
            <path class="on-solid" d="M194 76v12M188 82h12"/>
            <rect class="card" x="30" y="108" width="180" height="32" rx="10"/>
            <circle cx="54" cy="124" r="5"/>
            <circle class="solid" cx="87" cy="124" r="5"/>
            <circle cx="120" cy="124" r="5"/>
            <circle cx="153" cy="124" r="5"/>
            <circle cx="186" cy="124" r="5"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title"></h2>
          <p id="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="primary" type="button"></button>
      </div>
    </div>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#store": "./src/store.js",
          "#recipes": "./src/recipes.js",
          "#menu": "./src/menu.js",
          "#shops": "./src/shops.js",
          "#swipe": "./src/swipe.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#reorder": "./src/reorder.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#i18n": "./src/i18n.js",
          "#locales/ca": "./src/locales/ca.js",
          "#locales/de": "./src/locales/de.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#locales/fr": "./src/locales/fr.js",
          "#locales/it": "./src/locales/it.js",
          "#locales/pt": "./src/locales/pt.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
