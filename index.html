<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1f7a4d">
    <title>Grocely - Lista de la compra</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div id="ring" class="ring"><span id="ring-text" class="ring-text"></span></div>
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
      <button id="search-button" class="button icon" type="button" data-i18n-attr="aria-label:search.label" aria-controls="search" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#search"/></svg>
      </button>
      <button id="arrange-button" class="button icon" type="button" data-i18n-attr="aria-label:arrange.label" aria-haspopup="dialog" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#filter"/></svg>
      </button>
      <button id="trip-button" class="button icon" type="button" data-i18n-attr="aria-label:trip.menu" aria-haspopup="dialog" aria-controls="trip" hidden>
        <svg class="icon" aria-hidden="true"><use href="icons.svg#more"/></svg>
      </button>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-undo" class="button strong" type="button" data-i18n="toast.undo" hidden></button>
    </div>

    <svg class="icon corner" aria-hidden="true"><use href="icons.svg#basket"/></svg>

    <main>
      <div id="shop-chips" class="cluster scroll shop-lists" role="group" data-i18n-attr="aria-label:shops.lists" hidden></div>

      <div id="shop-done" class="empty-state" hidden>
        <p id="shop-done-text"></p>
        <button id="shop-done-next" class="button primary" type="button"></button>
      </div>

      <div id="search" class="search" hidden>
        <input id="query" class="input raised" type="search" maxlength="80" autocomplete="off" enterkeyhint="search">
      </div>

      <ul id="items" class="item-list"></ul>

      <div id="empty" class="empty-state" hidden>
        <p id="empty-text"></p>
        <button id="bring" class="button primary" type="button" hidden></button>
      </div>

      <ul id="saved" class="item-list" hidden></ul>

      <div id="menu-actions" class="split menu-actions" hidden>
        <button id="menu-fill" class="button primary hand-side" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#cart-add"/></svg><span data-i18n="menu.fill"></span></button>
        <button id="menu-clear" class="button outline" type="button" data-i18n="menu.clear"></button>
      </div>

      <section id="finish" class="banner" hidden>
        <strong data-i18n="finish.question"></strong>
        <p id="finish-text" class="banner-text"></p>
        <button id="finish-button" class="button primary wide" type="button" data-i18n="finish.button"></button>
      </section>

      <section id="settings" class="settings" hidden>
        <h2 class="settings-title" data-i18n="settings.backup"></h2>
        <div class="list-group pair">
          <button id="export" class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#export"/></svg><span data-i18n="settings.export"></span></button>
          <button id="import" class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#import"/></svg><span data-i18n="settings.import"></span></button>
        </div>
        <h2 class="settings-title" data-i18n="settings.language"></h2>
        <div class="list-group">
          <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
        </div>
        <h2 class="settings-title" data-i18n="settings.hand"></h2>
        <div class="list-group">
          <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
        </div>
        <h2 class="settings-title" data-i18n="settings.theme"></h2>
        <div class="list-group">
          <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
        </div>
        <h2 class="settings-title" data-i18n="settings.modules"></h2>
        <div class="list-group">
          <label class="switch"><span data-i18n="list.next"></span><input class="switch-input" type="checkbox" role="switch" data-module="next"></label>
          <label class="switch"><span data-i18n="settings.moduleRecipes"></span><input class="switch-input" type="checkbox" role="switch" data-module="recipes"></label>
        </div>
        <h2 class="settings-title" data-i18n="settings.app"></h2>
        <div class="list-group">
          <button id="install" class="list-row" type="button" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#download"/></svg><span data-i18n="settings.install"></span></button>
        </div>
        <h2 class="settings-title" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="list-row" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#help"/></svg><span data-i18n="settings.onboarding"></span></button>
          <button id="delete-sample" class="list-row" type="button" hidden><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="settings.deleteSample"></span></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="active">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#cart"/></svg>
        <span data-i18n="list.active"></span>
      </button>
      <button class="nav-item" type="button" data-view="next">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#calendar"/></svg>
        <span data-i18n="list.next"></span>
        <em id="next-count" class="badge"></em>
      </button>
      <button class="nav-item" type="button" data-view="recipes">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#book"/></svg>
        <span data-i18n="nav.recipes"></span>
      </button>
      <button class="nav-item" type="button" data-view="menu">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#menu"/></svg>
        <span data-i18n="nav.menu"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="sheet" class="sheet-layer" hidden>
      <div id="veil" class="sheet-veil"></div>
      <form id="add" class="sheet" autocomplete="off">
        <div class="sheet-grab"></div>
        <div class="input-row">
          <input id="add-name" class="input strong" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="80">
          <button id="add-submit" class="button primary" type="submit"></button>
        </div>
        <div id="seg" class="segmented">
          <button class="segment" type="button" data-target="active" data-i18n="add.today"></button>
          <button class="segment" type="button" data-target="next" data-i18n="add.later"></button>
        </div>
        <ul id="suggestions" class="list-group plain" data-i18n-attr="aria-label:add.existing"></ul>
      </form>
    </div>

    <div id="arrange" class="sheet-layer" hidden>
      <div id="arrange-veil" class="sheet-veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:arrange.label">
        <div class="sheet-grab"></div>
        <div id="arrange-group">
          <h2 class="sheet-title" data-i18n="arrange.groupBy"></h2>
          <div class="segmented">
            <button class="segment" type="button" data-group="recipe" data-i18n="nav.recipes"></button>
            <button class="segment" type="button" data-group="shop" data-i18n="arrange.shops"></button>
            <button class="segment" type="button" data-group="none" data-i18n="arrange.none"></button>
          </div>
        </div>
        <div id="arrange-sort">
          <h2 class="sheet-title" data-i18n="arrange.sortBy"></h2>
          <div class="segmented">
            <button class="segment" type="button" data-sort="name" data-i18n="arrange.name"></button>
            <button class="segment" type="button" data-sort="custom" data-i18n="arrange.custom"></button>
          </div>
        </div>
        <div id="arrange-lists">
          <h2 class="sheet-title" data-i18n="shops.lists"></h2>
          <div class="segmented">
            <button class="segment" type="button" data-lists="show" data-i18n="arrange.show"></button>
            <button class="segment" type="button" data-lists="hide" data-i18n="arrange.hide"></button>
          </div>
        </div>
      </div>
    </div>

    <div id="trip" class="sheet-layer" hidden>
      <div id="trip-veil" class="sheet-veil"></div>
      <div class="sheet" role="dialog" data-i18n-attr="aria-label:trip.menu">
        <div class="sheet-grab"></div>
        <h2 class="sheet-title" data-i18n="trip.menu"></h2>
        <button id="finish-menu" class="entry" type="button"><span data-i18n="finish.button"></span><small id="finish-menu-text" class="entry-note"></small></button>
      </div>
    </div>

    <div id="meal" class="sheet-layer" hidden>
      <div id="meal-veil" class="sheet-veil"></div>
      <div id="meal-sheet" class="sheet" role="dialog">
        <div class="sheet-grab"></div>
        <h2 id="meal-title" class="sheet-title"></h2>
        <input id="meal-query" class="input" type="search" maxlength="80" autocomplete="off" enterkeyhint="search" data-i18n-attr="placeholder:recipes.search,aria-label:recipes.search">
        <p id="meal-empty" class="empty-state inline" hidden></p>
        <div id="meal-chips" class="cluster"></div>
        <button id="meal-remove" class="button outline danger wide" type="button" data-i18n="menu.remove" hidden></button>
      </div>
    </div>

    <div id="edit" class="sheet-layer" hidden>
      <div id="edit-veil" class="sheet-veil"></div>
      <form id="edit-form" class="sheet" role="dialog" autocomplete="off">
        <div class="sheet-grab"></div>
        <h2 id="edit-title" class="sheet-title"></h2>
        <label class="field"><input id="edit-name" class="input field-input" type="text" enterkeyhint="done" maxlength="80" data-i18n-attr="aria-label:edit.name,placeholder:edit.name"><span class="field-label" data-i18n="edit.name"></span></label>
        <label class="field"><input id="edit-quantity" class="input field-input" type="text" enterkeyhint="done" maxlength="20" data-i18n-attr="aria-label:edit.quantity,placeholder:edit.quantity"><span class="field-label" data-i18n="edit.quantity"></span></label>
        <h2 class="sheet-title part" data-i18n="edit.shops"></h2>
        <div id="edit-chips" class="cluster"></div>
        <p id="edit-empty" class="empty-state inline" data-i18n="shops.empty" hidden></p>
        <div class="input-row">
          <input id="edit-shop" class="input strong" type="text" list="edit-shops" enterkeyhint="done" autocapitalize="words" maxlength="40" data-i18n-attr="placeholder:shops.placeholder,aria-label:shops.placeholder">
          <button class="button primary" type="submit" data-i18n="shops.add"></button>
        </div>
        <datalist id="edit-shops"></datalist>
      </form>
    </div>

    <div id="recipe" class="sheet-layer" hidden>
      <div id="recipe-veil" class="sheet-veil"></div>
      <div id="recipe-sheet" class="sheet" role="dialog">
        <div class="sheet-grab"></div>
        <h2 id="recipe-title" class="sheet-title" data-i18n="recipe.title"></h2>
        <label class="field"><input id="recipe-name" class="input field-input" type="text" enterkeyhint="done" maxlength="80" autocapitalize="sentences" data-i18n-attr="aria-label:edit.name,placeholder:edit.name"><span class="field-label" data-i18n="edit.name"></span></label>
        <label class="field"><input id="recipe-url" class="input field-input" type="url" inputmode="url" enterkeyhint="done" autocapitalize="off" data-i18n-attr="aria-label:recipe.link,placeholder:recipe.link"><span class="field-label" data-i18n="recipe.link"></span></label>
        <h2 class="sheet-title" data-i18n="recipe.products"></h2>
        <div id="recipe-products"></div>
      </div>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="lists" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card art-accent" x="20" y="20" width="90" height="120" rx="10"/>
            <rect class="art-accent" x="32" y="40" width="12" height="12" rx="3"/>
            <path class="art-accent" d="M35 46l2.5 2.5 4-5"/>
            <rect class="art-accent" x="32" y="70" width="12" height="12" rx="3"/>
            <rect class="art-accent" x="32" y="100" width="12" height="12" rx="3"/>
            <path d="M52 46h44M52 76h36M52 106h40"/>
            <rect class="art-card" x="130" y="20" width="90" height="120" rx="10"/>
            <path d="M144 46h62M144 76h50M144 106h56"/>
          </svg>
          <svg data-page="trip" viewBox="0 0 240 160" aria-hidden="true">
            <path class="art-accent" d="M200 62c-20-34-140-34-160 0M40 62l-2-11M40 62l11-3"/>
            <rect class="art-card" x="30" y="74" width="180" height="40" rx="10"/>
            <rect class="art-accent" x="42" y="88" width="12" height="12" rx="3"/>
            <path class="art-accent" d="M45 94l2.5 2.5 4-5"/>
            <path d="M64 94h80"/>
            <path class="art-accent" d="M196 94a8 8 0 1 1-2.3-5.7M194 84v5h-5"/>
          </svg>
          <svg data-page="row" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="20" y="50" width="132" height="40" rx="10"/>
            <rect class="art-accent" x="32" y="64" width="12" height="12" rx="3"/>
            <path d="M54 70h70"/>
            <rect class="art-soft" x="158" y="52" width="28" height="36" rx="6"/>
            <rect class="art-soft" x="190" y="52" width="28" height="36" rx="6"/>
            <path class="art-accent" d="M40 122h56M88 114l8 8-8 8"/>
            <path class="art-accent" d="M200 122h-56M152 114l-8 8 8 8"/>
          </svg>
          <svg data-page="sections" viewBox="0 0 240 160" aria-hidden="true">
            <path class="art-accent" d="M66 48h88M74 40l-8 8 8 8M146 40l8 8-8 8"/>
            <circle class="art-solid" cx="194" cy="82" r="13"/>
            <path class="art-on-solid" d="M194 76v12M188 82h12"/>
            <rect class="art-card" x="30" y="108" width="180" height="32" rx="10"/>
            <circle cx="54" cy="124" r="5"/>
            <circle class="art-solid" cx="87" cy="124" r="5"/>
            <circle cx="120" cy="124" r="5"/>
            <circle cx="153" cy="124" r="5"/>
            <circle cx="186" cy="124" r="5"/>
          </svg>
          <svg data-page="recipes" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="20" y="24" width="96" height="112" rx="10"/>
            <path class="art-accent" d="M34 46h52"/>
            <circle cx="38" cy="72" r="3"/>
            <circle cx="38" cy="94" r="3"/>
            <circle cx="38" cy="116" r="3"/>
            <path d="M48 72h48M48 94h36M48 116h42"/>
            <path class="art-accent" d="M124 80h16M134 74l6 6-6 6"/>
            <rect class="art-card" x="148" y="24" width="72" height="112" rx="10"/>
            <rect class="art-soft" x="158" y="38" width="22" height="16" rx="4"/>
            <rect class="art-solid" x="188" y="38" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="158" y="62" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="188" y="62" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="158" y="86" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="188" y="86" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="158" y="110" width="22" height="16" rx="4"/>
            <rect class="art-soft" x="188" y="110" width="22" height="16" rx="4"/>
          </svg>
          <svg data-page="sample" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="60" y="32" width="120" height="96" rx="10"/>
            <path class="art-accent" d="M74 54h64"/>
            <circle cx="78" cy="78" r="3"/>
            <circle cx="78" cy="102" r="3"/>
            <path d="M88 78h56M88 102h40"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
        <label id="onboarding-sample" class="switch onboarding-switch away"><span data-i18n="onboarding.sample.switch"></span><input id="sample-switch" class="switch-input" type="checkbox" role="switch" checked></label>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#store": "./src/store.js",
          "#recipes": "./src/recipes.js",
          "#menu": "./src/menu.js",
          "#shops": "./src/shops.js",
          "#swipe": "./src/swipe.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#reorder": "./src/reorder.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#install": "./src/install.js",
          "#i18n": "./src/i18n.js",
          "#locales/ca": "./src/locales/ca.js",
          "#locales/de": "./src/locales/de.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#locales/fr": "./src/locales/fr.js",
          "#locales/it": "./src/locales/it.js",
          "#locales/pt": "./src/locales/pt.js",
          "#ui/add": "./src/ui/add.js",
          "#ui/arrange": "./src/ui/arrange.js",
          "#ui/context": "./src/ui/context.js",
          "#ui/controls": "./src/ui/controls.js",
          "#ui/drag": "./src/ui/drag.js",
          "#ui/edit": "./src/ui/edit.js",
          "#ui/list": "./src/ui/list.js",
          "#ui/menu": "./src/ui/menu.js",
          "#ui/motion": "./src/ui/motion.js",
          "#ui/nav": "./src/ui/nav.js",
          "#ui/onboarding": "./src/ui/onboarding.js",
          "#ui/recipes": "./src/ui/recipes.js",
          "#ui/rows": "./src/ui/rows.js",
          "#ui/settings": "./src/ui/settings.js",
          "#ui/install": "./src/ui/install.js",
          "#ui/view": "./src/ui/view.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
